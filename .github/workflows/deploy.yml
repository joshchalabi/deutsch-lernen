name: Deploy to GitHub Pages

# YALNIZCA ELLE TETİKLENİR.
#
# Bu depo şu an `npm run deploy` ile yayımlanıyor: derleme yerelde yapılıp
# hazır dosyalar gh-pages dalına gönderiliyor. Actions yolu hesapta
# faturalandırma kilidi olduğu için çalışmıyor ve her push'ta kırmızı hata
# üretiyordu — gürültü, bilgi değil.
#
# Faturalandırma çözülünce burayı tekrar otomatiğe almak için:
#   on: { push: { branches: [main] }, workflow_dispatch: }
# ve Pages kaynağını Settings → Pages'ten "GitHub Actions"a çevir.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayım; yeni gönderim eskisini beklemesin diye iptal etmiyoruz
# (yarım kalan yayım siteyi bozuk bırakabilir).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        # Depo adı base yolunu belirler; fork/yeniden adlandırmada otomatik uyar.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
